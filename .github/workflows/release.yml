name: Release

on:
  push:
    branches:
      - release
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist
          zip -r ../simulateur-ri-${{ github.ref_name }}.zip .
          cd ..

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: simulateur-ri-${{ github.ref_name }}.zip
          generate_release_notes: true
